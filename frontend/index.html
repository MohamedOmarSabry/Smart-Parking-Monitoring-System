<!doctype html>
<html>
    <head>
        <title>Smart Parking</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1 class="title">Smart Parking Dashboard</h1>

            <div class="summary-grid">
                <div class="card">
                    <h2>Total</h2>
                    <div class="big-number" id="total">0</div>
                </div>
                <div class="card occupied">
                    <h2>Occupied</h2>
                    <div class="big-number" id="occupied">0</div>
                </div>
                <div class="card free">
                    <h2>Free</h2>
                    <div class="big-number" id="free">0</div>
                </div>
            </div>

            <!-- Per-lane breakdown (populated by app.js) -->
            <div id="lanes"></div>

            <p class="status" id="status">Connecting...</p>
        </div>
        <script src="app.js"></script>
    </body>
</html>
